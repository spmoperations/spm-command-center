<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SPM Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header + tab bar; Today = schedule column beside a stack of "needs you" panels; other tabs are full-width work surfaces. */
:root {
  --bg: #ECEEF2; --surface: #FFFFFF; --surface-2: #F5F6F9; --line: #DCE0E7;
  --ink: #121722; --muted: #5B6474; --accent: #3346D3; --accent-soft: #E3E6FB;
  --good: #17804F; --good-soft: #DDF1E6; --warn: #9A6200; --warn-soft: #F8ECD2; --bad: #C23B22; --bad-soft: #F9E1DB;
  --slack: #7A3E7A; --wa: #1B7F46; --tg: #1F6FB2; --im: #2F7D86;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1016; --surface: #151A22; --surface-2: #1B212B; --line: #2A313D;
  --ink: #E7EAF0; --muted: #97A0AF; --accent: #8E9BFF; --accent-soft: #232A4F;
  --good: #4CC38A; --good-soft: #15301F; --warn: #E3A63A; --warn-soft: #33270F; --bad: #F07860; --bad-soft: #3A1A14;
  --slack: #C98BC9; --wa: #4CC38A; --tg: #6DB2EE; --im: #62C2CC; color-scheme: dark; } }
:root[data-mode="personal"] { --accent: #0F7B6C; --accent-soft: #DCF1EC; }
@media (prefers-color-scheme: dark) { :root[data-mode="personal"]:not([data-theme="light"]) { --accent: #4FD1BC; --accent-soft: #12332E; } }
:root[data-theme="dark"][data-mode="personal"] { --accent: #4FD1BC; --accent-soft: #12332E; }
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #151A22; --surface-2: #1B212B; --line: #2A313D;
  --ink: #E7EAF0; --muted: #97A0AF; --accent: #8E9BFF; --accent-soft: #232A4F;
  --good: #4CC38A; --good-soft: #15301F; --warn: #E3A63A; --warn-soft: #33270F; --bad: #F07860; --bad-soft: #3A1A14;
  --slack: #C98BC9; --wa: #4CC38A; --tg: #6DB2EE; --im: #62C2CC; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 14px 0; display: flex; flex-direction: column; gap: 12px; }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand-row h1 { font-size: 24px; font-weight: 700; }
.brand-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.mode-seg button { padding: 6px 14px; }
.brand-row .date { color: var(--muted); font-size: 14px; }
.sample { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
.brand-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 0; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 14px 10px; border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
nav.tabs a[data-tab="settings"] { margin-left: auto; }
nav.tabs a svg { width: 16px; height: 16px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--f-mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--muted); }
nav.tabs .count.hot { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

section.view { padding-top: 22px; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.view-head h2 { font-size: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.panel-head h3 { font-size: 16px; font-weight: 700; }
.panel-head a { color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 600; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; line-height: 1.6; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-high, .s-behind { background: var(--bad-soft); color: var(--bad); }
.p-mid, .s-risk { background: var(--warn-soft); color: var(--warn); }
.p-low { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.s-ok { background: var(--good-soft); color: var(--good); }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.biz { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

/* Source badge */
.src { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 600 11px var(--f-mono); color: var(--surface); flex: none; }
.src-slack { background: var(--slack); } .src-whatsapp { background: var(--wa); } .src-telegram { background: var(--tg); } .src-imessage { background: var(--im); }

/* Today */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.pace-panel { margin-bottom: 18px; }
.split-row { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; align-items: start; }
.split-row .pace-panel { margin-bottom: 0; }
.links { list-style: none; margin: 0; padding: 0 16px; }
.links li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.links li:first-child { border-top: 0; }
.links a { color: var(--accent); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.links a:hover { text-decoration: underline; }
.links a::after { content: " ↗"; font-weight: 400; font-size: 12px; }
.links .dom { display: block; font: 12px var(--f-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.links .x:hover { color: var(--bad); background: var(--bad-soft); }
.link-add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 6px; padding: 10px 16px 16px; }
.pace-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 6px; }
.pace-grid .pace-row { border-top: 0; border-left: 1px solid var(--line); }
.pace-grid .pace-row:first-child { border-left: 0; }
.toggle { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.toggle:hover { color: var(--accent); border-color: var(--accent); }
.toggle .chev { display: inline-block; transition: transform .2s ease; }
.toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.panel.collapsed .panel-head { padding-bottom: 14px; }
.mini-list li.done .who { text-decoration: line-through; }
.mini-list li.done { opacity: 0.5; }
.stack { display: grid; gap: 18px; min-width: 0; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.sum .v { font: 600 26px/1.2 var(--f-mono); margin-top: 4px; }
.sum .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

.timeline { list-style: none; margin: 0; padding: 0 16px 14px; }
.tl { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl:first-child { border-top: 0; }
.tl .t { font: 600 13px var(--f-mono); padding-top: 2px; }
.tl .t small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.tl .body { min-width: 0; border-left: 3px solid var(--line); padding-left: 12px; }
.tl.k-call .body { border-left-color: var(--accent); }
.tl.k-focus .body { border-left-color: var(--good); }
.tl.k-personal .body { border-left-color: var(--im); }
.tl.k-task .body { border-left-color: var(--warn); }
.tl .title { font-weight: 600; }
.tl .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.tl.past { opacity: 0.5; }
.tl.now-row .t { color: var(--accent); }
.now-line { display: flex; align-items: center; gap: 8px; color: var(--accent); font: 600 11.5px var(--f-mono); padding: 4px 0; }
.now-line::after { content: ""; flex: 1; height: 2px; background: var(--accent); border-radius: 2px; }

.mini-list { list-style: none; margin: 0; padding: 0 16px 12px; }
.mini-list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.mini-list li:first-child { border-top: 0; }
.mini-list .grow { flex: 1; min-width: 0; }
.mini-list .who { font-weight: 600; font-size: 14px; }
.mini-list .txt { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.empty { padding: 4px 16px 16px; color: var(--muted); font-size: 14px; }

.pace-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; }
.pace-row:first-of-type { border-top: 0; }
.pace-row .name { font-weight: 600; font-size: 14px; }
.pace-row .fig { font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; position: relative; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: visible; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.bar .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; }
.fill.ok { background: var(--good); } .fill.risk { background: var(--warn); } .fill.behind { background: var(--bad); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
select.f, input.f { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }

/* Inbox */
.inbox-group { margin-bottom: 20px; }
.group-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
.group-head .n { font-size: 13px; color: var(--muted); }
.msg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: start; }
.msg:first-child { border-top: 0; }
.msg .line1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg .who { font-weight: 600; }
.msg .ctx { font-size: 13px; color: var(--muted); }
.msg .txt { margin: 3px 0 0; font-size: 14.5px; }
.msg .side { display: flex; flex-direction: column; align-items: end; gap: 8px; }
.msg .ago { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.msg .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.msg .acts select { font-size: 12.5px; padding: 4px 6px; }
.msg .acts .btn { padding: 4px 10px; font-size: 12.5px; }
.msg.replied .who::after { content: " · Replied"; color: var(--good); font-weight: 600; font-size: 12.5px; }
.msg.open { background: var(--surface-2); }
.thread { grid-column: 1 / -1; display: grid; gap: 12px; padding-top: 4px; }
.bubbles { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 2px; }
.bubble { max-width: min(78%, 560px); padding: 8px 12px; border-radius: 12px; font-size: 14.5px; background: var(--surface); border: 1px solid var(--line); align-self: flex-start; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.bubble .bmeta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); margin-top: 3px; font-family: var(--f-mono); }
.bubble .queued { color: var(--warn); font-weight: 600; font-family: var(--f-body); }
.composer { display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14.5px; color: var(--ink); }
.composer textarea:focus { border-color: var(--accent); outline: none; }
.composer-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer-row .hint { font-size: 12.5px; color: var(--muted); }
.composer-row .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.outbox-note { font-size: 13px; color: var(--warn); background: var(--warn-soft); padding: 2px 10px; border-radius: 99px; font-weight: 600; }
.mini-list .reply-link { color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: none; }

/* Tasks */
.addtask { display: grid; grid-template-columns: minmax(0, 2.4fr) repeat(5, minmax(0, 1fr)) auto; gap: 8px; padding: 12px; margin-bottom: 14px; }
.table-scroll { overflow-x: auto; }
table.tasks { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
table.tasks th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tasks td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tasks tr:last-child td { border-bottom: 0; }
table.tasks tr.done td { opacity: 0.45; }
table.tasks tr.done .t-title { text-decoration: line-through; }
.t-title { font-weight: 600; }
.due { font: 12.5px var(--f-mono); white-space: nowrap; }
.due.over { color: var(--bad); font-weight: 600; }
.due.today { color: var(--warn); font-weight: 600; }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
th.sortable { cursor: pointer; }

/* Meetings */
.mt-group { margin-bottom: 22px; }
.mt-group > .label { margin-bottom: 8px; display: block; }
.mt { border-top: 1px solid var(--line); }
.mt:first-child { border-top: 0; }
.mt-head { width: 100%; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; cursor: pointer; }
.mt-head:hover { background: var(--surface-2); }
.mt.open .mt-head { background: var(--surface-2); }
.mt-when { font: 600 13px var(--f-mono); }
.mt-when small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.mt-title { font-weight: 600; font-size: 15px; }
.mt-who { font-size: 13px; color: var(--muted); }
.mt-chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: end; }
.chev { display: inline-block; color: var(--muted); transition: transform .2s ease; }
.mt.open .mt-head .chev { transform: rotate(180deg); }
.mt-body { padding: 4px 16px 18px; display: grid; gap: 16px; background: var(--surface-2); }
.mt-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.mt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.mt-card h4 { margin: 0; }
.mt-card p { margin: 0; }
.mt-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.decided { font-size: 14px; }
.decided li::marker { content: "✓  "; color: var(--good); }
.mt-tasks { list-style: none; padding: 0 !important; margin: 0; }
.mt-tasks li { display: flex; gap: 10px; align-items: flex-start; }
.mt-tasks li.done .t-name { text-decoration: line-through; opacity: .55; }
.transcript { display: grid; gap: 8px; font-size: 14px; }
.transcript .line { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.transcript .spk { font-weight: 600; color: var(--muted); font-size: 13px; }
.transcript .spk.me { color: var(--accent); }
.srclink { color: var(--accent); text-decoration: none; font-size: 12.5px; font-weight: 600; }
.srclink:hover { text-decoration: underline; }
.t-src { margin-top: 2px; }
.tl .title a { color: inherit; text-decoration: none; }
.tl .title a:hover { color: var(--accent); text-decoration: underline; }

/* Suggestions */
.sg-panel { margin-bottom: 14px; }
.sg-intro { margin: 0; padding: 0 16px 10px; font-size: 13.5px; color: var(--muted); }
.sg-list { display: grid; }
.sg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
.sg-why { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.sg-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.sg-ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: end; }
.sg-ctrl .f { padding: 4px 8px; font-size: 12.5px; }
.sg-ctrl .btn { padding: 4px 10px; font-size: 12.5px; }
.mt-card .sg { grid-template-columns: minmax(0, 1fr); padding: 10px 0 0; }
.mt-card .sg-ctrl { justify-content: start; }
.scan-status { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.sg-foot { padding: 0 16px 14px; font-size: 13.5px; }
.sg-foot a { color: var(--accent); font-weight: 600; text-decoration: none; }

/* Task sections */
.sec { margin-bottom: 14px; overflow: hidden; }
.sec-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: none; border: 0; cursor: pointer; text-align: left; }
.sec-head:hover { background: var(--surface-2); }
.sec-head h3 { font-size: 16px; }
.sec-head .sub { font-size: 13px; color: var(--muted); }
.sec-head .n { margin-left: auto; font: 600 12.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
.sec-head .chev { transition: transform .2s ease; }
.sec-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sec .table-scroll { border-top: 1px solid var(--line); }
tr.later-row td { background: var(--surface-2); padding: 6px 12px; }

<script>
(() => {
const NOW = new Date();
const pad = n => String(n).padStart(2, "0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayFromToday = n => { const d = new Date(NOW); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return isoDay(d); };
const TODAY = isoDay(NOW);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);

const SOURCES = { slack: "SL", whatsapp: "WA", telegram: "TG", imessage: "iM" };
const SOURCE_NAMES = { slack: "Slack", whatsapp: "WhatsApp", telegram: "Telegram", imessage: "iMessage" };

// Older department names, mapped onto the current ones.
const DEPT_RENAME = { Sales: "SPM Sales", Marketing: "SPM Marketing", Delivery: "Client Sales", Finance: "Finances" };
const DEPT_ABOUT = {
  "Client Sales": "Work that drives results for clients: their content, hooks, reports and deliverables.",
  "SPM Sales": "Selling Social Profit Media: discovery calls, proposals, follow-ups and contracts.",
  "SPM Marketing": "Marketing Social Profit Media: your content, podcast appearances and personal brand.",
  "Operations": "Hiring, SOPs, contractors and keeping the team running.",
  "Finances": "Invoices, payments, payroll and taxes.",
};
// Default team, editable in Settings. "handles" are the kinds of work each person can own;
// delegation matches them against a task's title and project.
function sampleTeam() {
  const p = (id, name, role, depts, handles) => ({ id, name, role, depts, handles });
  return [
    p("u1", "Priya Shah", "Sales lead", ["Sales"], ["Discovery calls", "Follow-ups", "No-shows", "Proposals"]),
    p("u2", "Marcus Reed", "Appointment setter", ["Sales"], ["Outbound DMs", "Booking calls", "Follow-ups"]),
    p("u3", "Tess Nguyen", "Content strategist", ["Marketing"], ["Content calendar", "Podcast", "Reels", "Consulting"]),
    p("u4", "Luis Ramos", "Lead editor", ["Delivery"], ["Editing", "Hooks", "Clip QA", "Harbor Realty", "Vendly"]),
    p("u5", "Kai Brooks", "Editor", ["Delivery"], ["Editing", "Captions", "Frame.io", "Apex Fitness Co"]),
    p("u6", "Gavin Cole", "Operations manager", ["Operations", "Finance"], ["Hiring", "SOPs", "Contractors", "Payroll"]),
    p("u7", "Rene Park", "Bookkeeper", ["Finance"], ["Invoices", "Payments", "Receivables"]),

}
// Chat rules: first match wins. field: "ctx" (channel or chat) or "from" (person); empty value matches anything.
function sampleLinks() {
  const l = (label, url) => ({ id: "l" + Math.random().toString(36).slice(2, 8), label, url });
  return {
    business: [l("Google Drive", "https://drive.google.com"), l("Frame.io reviews", "https://app.frame.io"), l("Stripe dashboard", "https://dashboard.stripe.com"), l("Slack", "https://app.slack.com")],
    personal: [l("Google Calendar", "https://calendar.google.com"), l("Oura", "https://cloud.ouraring.com"), l("American Express", "https://www.americanexpress.com")],
  };
}
// Accepts "example.com" or a full address; only web links (http/https) are allowed.
function cleanUrl(raw) {
  let v = String(raw || "").trim();
  if (!v) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
  try { const u = new URL(v); return u.protocol === "https:" || u.protocol === "http:" ? u.href : null; } catch (e) { return null; }
}
function linksPanel() {
  const list = state.links[mode] = state.links[mode] || [];
  const host = u => { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return u; } };
  return `<div class="panel"><div class="panel-head"><h3>Quick links</h3><span class="muted num" style="font-size:13px">${list.length}</span></div>
    ${list.length ? `<ul class="links">${list.map(k => `<li><div style="min-width:0"><a href="${esc(k.url)}" target="_blank" rel="noopener noreferrer">${esc(k.label)}</a><span class="dom">${esc(host(k.url))}</span></div>
      <button class="x" data-dellink="${k.id}" aria-label="Remove ${esc(k.label)}">×</button></li>`).join("")}</ul>` : `<p class="empty">No links yet. Add the resources you open every day.</p>`}

// ---------- Rules + delegation matching ----------
const norm = x => String(x || "").toLowerCase().replace(/[^a-z0-9#]+/g, " ").trim();
function ruleMatches(r, i) {
  if (r.source !== "any" && r.source !== i.source) return false;
  if (r.op === "any") return true;
  const hay = norm(r.field === "from" ? i.from : i.ctx), v = norm(r.value);
  if (!v) return true;
  return r.op === "is" ? hay === v : r.op === "starts" ? hay.startsWith(v) : hay.includes(v);
}
function applyRules() {
  for (const i of state.inbox) {
    if (i.manual) continue;   // reclassified by hand in the inbox
    const r = state.rules.find(r => ruleMatches(r, i));
    if (r) { i.cat = r.cat; i.line = r.cat === "business" ? r.line || "agency" : null; }
  }
}
function fitFor(person, t) {
  const text = " " + norm(t.title + " " + t.project) + " ";
  return person.handles.filter(h => { const k = norm(h).replace(/s$/, ""); return k && text.includes(" " + k); });
}
function candidates(t, all) {
  return state.team.map(p => ({ ...p, matched: fitFor(p, t) }))
    .filter(p => all || p.depts.includes(t.dept) || p.matched.length)
    .sort((a, b) => b.matched.length - a.matched.length || (b.depts.includes(t.dept) - a.depts.includes(t.dept)));
}

function responsible(t) { return t.delegatedTo ? t.delegatedTo.name : null; }
function deptTasks(d) { return state.tasks.filter(t => t.type === "business" && t.dept === d); }

    ${groups.map(([name, g]) => `<div class="mt-group"><span class="label">${name}</span><div class="panel">${g.map(meetingRow).join("")}</div></div>`).join("") || `<div class="panel"><p class="empty" style="padding:18px">No meetings for this project.</p></div>`}`;
}

const SECTIONS = [
  { key: "high", title: "High priority", sub: "Do these first" },
  { key: "mid", title: "Medium priority", sub: "Next 48 hours" },
  { key: "low", title: "Low priority", sub: "Next 48 hours" },
];
function taskRow(t) {
  const d = t.done ? { t: "Done", c: "" } : dueLabel(t.due);
  const cls = t.done ? "done" : t.delegatedTo ? "delegated" : "";
  const action = t.done ? "" : t.delegatedTo
    ? `<button class="linkbtn inline" data-undelegate="${t.id}">Take back</button>`
    : canDelegate(t) ? `<button class="btn dg" data-delegate="${t.id}" aria-expanded="${ui.delegating === t.id}" title="Someone in ${esc(t.dept)} can own this">Delegate</button>` : "";
  let html = `<tr class="${cls}">
    <td><input type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="Done: ${esc(t.title)}"></td>
    <td><div class="t-title">${esc(t.title)}</div>${t.src ? `<div class="t-src">${srcLink(t.src)}</div>` : ""}
      ${t.delegatedTo ? `<div class="dg-note"><span class="chip dg-chip">Delegated · ${esc(t.delegatedTo.name)}</span> ${esc(t.delegatedTo.note)}</div>` : ""}</td>
    <td><span class="chip ${t.type === "business" ? "biz" : ""}">${t.type === "business" ? "Business" : "Personal"}</span></td>
    <td>${esc(t.dept)}</td><td>${esc(t.project)}</td>
    <td><select class="f" data-tpri="${t.id}" aria-label="Priority">${opts(["high", "mid", "low"], t.pri, PRI)}</select></td>
    <td><span class="due ${d.c}">${d.t}</span></td>
    <td style="text-align:right">${action}</td></tr>`;
  if (ui.delegating === t.id) html += delegateRow(t);
  return html;
}
function delegateRow(t) {
  const people = candidates(t, ui.dgAll);
  const chosen = ui.dgTo && people.some(p => p.name === ui.dgTo) ? ui.dgTo : people[0] && people[0].name;
  return `<tr class="dg-row"><td></td><td colspan="7">
    <form class="dg-form" id="dg-form" data-task="${t.id}">
      <h4>Delegate to ${ui.dgAll ? "anyone on the team" : `someone in ${esc(t.dept)} or with matching responsibilities`}</h4>
      <div class="people" role="radiogroup" aria-label="Team member">${people.map(p => `<label class="person"><input type="radio" name="dg-to" value="${esc(p.name)}" ${p.name === chosen ? "checked" : ""}>
        <span>${esc(p.name)} <small>${esc(p.role)}${ui.dgAll || !p.depts.includes(t.dept) ? " · " + esc(p.depts.join(", ")) : ""}</small>${p.matched.length ? `<br><span class="fit">Best fit: ${esc(p.matched.join(", "))}</span>` : ""}</span></label>`).join("")}</div>
      <button type="button" class="linkbtn inline" data-dgall="1" style="justify-self:start">${ui.dgAll ? "Show suggested people only" : "Show everyone"}</button>
      <label class="label" for="dg-note">What needs to be done</label>
      <textarea id="dg-note" placeholder="Context, what done looks like, and anything they need from you" required>${esc(ui.dgNote)}</textarea>
      <div class="dg-actions">
        <label class="label" for="dg-due" style="margin:0">Due</label><input class="f" type="date" id="dg-due" value="${t.due < TODAY ? TODAY : t.due}">
        <button class="btn primary" type="submit">Delegate</button>
        <button class="btn" type="button" data-dgcancel="1">Cancel</button>
        <span class="hint">They'll get a Slack message with your note. Slack isn't connected yet, so it waits in the outbox.</span>
      </div>
    </form></td></tr>`;
}
function renderTasks() {
  const list = state.tasks.filter(t =>
    inMode(t) && (mode === "personal" || ((ui.tDept === "all" || t.dept === ui.tDept) && (ui.tProj === "all" || t.project === ui.tProj))) &&
    (ui.tStatus === "all" || (ui.tStatus === "open" ? mine(t) : ui.tStatus === "delegated" ? !t.done && t.delegatedTo : t.done))
  );
  const soonCut = dayFromToday(2);
  const byDue = (a, b) => a.due.localeCompare(b.due);
  const secOpen = prefs.secOpen || {};
  const sections = SECTIONS.map(sec => {
    const inSec = list.filter(t => t.pri === sec.key);
    const open = inSec.filter(mine).sort(byDue);
    const soon = sec.key === "high" ? open : open.filter(t => t.due <= soonCut);
    const later = sec.key === "high" ? [] : open.filter(t => t.due > soonCut);
    const delegated = inSec.filter(t => !t.done && t.delegatedTo).sort(byDue);
    const done = inSec.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const isOpen = secOpen[sec.key] !== false;
    const showLater = ui.showLater.has(sec.key);
    const overdue = open.filter(t => t.due < TODAY).length;
    const countTxt = `${soon.length} open${overdue ? ` · ${overdue} overdue` : ""}${later.length ? ` · ${later.length} later` : ""}`;
    const rows = soon.map(taskRow).join("")
      + (later.length ? `<tr class="later-row"><td></td><td colspan="7"><button data-later="${sec.key}" aria-expanded="${showLater}">${showLater ? "Hide" : "Show"} ${later.length} due after the next 48 hours</button></td></tr>` + (showLater ? later.map(taskRow).join("") : "") : "")
      + delegated.map(taskRow).join("") + done.map(taskRow).join("");
    return `<div class="panel sec sec-${sec.key}">
      <button class="sec-head" data-sec="${sec.key}" aria-expanded="${isOpen}"><span class="chev" aria-hidden="true">▾</span><h3>${sec.title}</h3><span class="sub">${sec.sub}</span><span class="n">${countTxt}</span></button>
      ${isOpen ? `<div class="table-scroll"><table class="tasks">
        <thead><tr><th style="width:36px"><span style="position:absolute;left:-9999px">Done</span></th><th>Task</th><th>Type</th><th>Department</th><th>Project</th><th>Priority</th><th>Due</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="8" class="muted" style="padding:16px">${sec.key === "high" ? "No high-priority tasks." : "Nothing due in the next 48 hours."}</td></tr>`}</tbody>
      </table></div>` : ""}
    </div>`;
  }).join("");
  // Personal: one list, soonest due first, then highest priority; done at the bottom.
  const flat = [...list].sort((a, b) => (a.done - b.done) || (a.done ? (b.doneAt || 0) - (a.doneAt || 0) : a.due.localeCompare(b.due) || PRI_RANK[a.pri] - PRI_RANK[b.pri]));
  const flatTable = `<div class="panel table-scroll"><table class="tasks">
      <thead><tr><th style="width:36px"><span style="position:absolute;left:-9999px">Done</span></th><th>Task</th><th>Type</th><th>Department</th><th>Project</th><th>Priority</th><th>Due</th><th></th></tr></thead>
      <tbody>${flat.map(taskRow).join("") || `<tr><td colspan="8" class="muted" style="padding:16px">No tasks match.</td></tr>`}</tbody></table></div>`;
  const sel = (key, label, vals, labels) => `<select class="f" data-uisel="${key}" aria-label="${label}"><option value="all">${label}: All</option>${opts(vals, ui[key], labels)}</select>`;
  const delegatedCount = state.tasks.filter(t => inMode(t) && !t.done && t.delegatedTo).length;
  $("#v-tasks").innerHTML = `
    <div class="view-head"><div><h2>Tasks</h2><div class="muted" style="font-size:14px">${state.tasks.filter(t => inMode(t) && mine(t)).length} on your plate · ${state.tasks.filter(t => inMode(t) && mine(t) && t.due < TODAY).length} overdue${delegatedCount ? ` · ${delegatedCount} delegated` : ""}</div></div></div>
    ${suggestionsPanel()}
    <form class="panel addtask" id="addtask">
      <input class="f" id="nt-title" placeholder="New task" required aria-label="Task">
      <select class="f" id="nt-type" aria-label="Type">${opts(["business", "personal"], mode, { business: "Business", personal: "Personal" })}</select>
      <select class="f" id="nt-dept" aria-label="Department">${opts(DEPTS, mode === "personal" ? "Personal" : "Operations")}</select>
      <select class="f" id="nt-proj" aria-label="Project">${opts(PROJECTS, mode === "personal" ? "Personal" : "Internal Ops")}</select>
      <select class="f" id="nt-pri" aria-label="Priority">${opts(["high", "mid", "low"], "mid", PRI)}</select>
      <input class="f" id="nt-due" type="date" value="${TODAY}" aria-label="Due date">
      <button class="btn primary" type="submit">Add task</button>
    </form>
    <div class="filters">
      ${sel("tStatus", "Status", ["open", "delegated", "done"], { open: "On my plate", delegated: "Delegated", done: "Done" })}
      ${mode === "business" ? `${sel("tDept", "Department", DEPTS)}${sel("tProj", "Project", PROJECTS)}` : ""}
    </div>
    ${mode === "personal" ? flatTable : sections}`;
}

function spark(e) {
  const W = 300, H = 84, pl = 4, pr = 4, pt = 8, pb = 16;
  const max = Math.max(e.m.target, e.series.at(-1) || 0) * 1.05;
  const x = d => pl + (d / DIM) * (W - pl - pr), y = v => pt + (1 - v / max) * (H - pt - pb);
  const pts = e.series.map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`);
  const color = { ok: "var(--good)", risk: "var(--warn)", behind: "var(--bad)" }[e.status];
  const area = pts.length ? `M${x(0)},${y(0)} L${pts.join(" L")} L${x(e.series.length)},${y(0)} Z` : "";
  const last = e.series.length ? `<circle cx="${x(e.series.length)}" cy="${y(e.series.at(-1))}" r="3.5" fill="${color}"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative ${esc(e.m.name)} versus target pace">
    <line x1="${x(0)}" y1="${y(e.m.target)}" x2="${x(DIM)}" y2="${y(e.m.target)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(DIM)}" y2="${y(0)}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(DIM)}" y2="${y(e.m.target)}" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
    ${area ? `<path d="${area}" fill="${color}" opacity="0.13"/>` : ""}
    ${pts.length ? `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>` : ""}
    ${last}
  </svg>`;
}

function renderTargets() {
  const all = METRICS.map(evalMetric);
  const parents = all.filter(e => !e.m.parent);
  const lagging = all.filter(e => e.status !== "ok").sort((a, b) => a.ratio - b.ratio);
  const el = elapsedDays();
  const cards = parents.map(e => {
    const kids = all.filter(k => k.m.parent === e.m.id);
    const diff = e.actual - e.expected;
    return `<div class="panel tgt">
      <div class="tgt-top"><div><div class="label">${MONTH_NAME} target</div><h3>${esc(e.m.name)}</h3></div>${pill("s-" + e.status, STATUS_TXT[e.status])}</div>
      <div class="big">${fmt(e.actual, e.m.unit)} <small>of ${fmt(e.m.target, e.m.unit)}</small></div>
      ${spark(e)}
      <div class="tgt-stats">
        <div><div class="label">vs. pace</div><div class="v" style="color:${diff >= 0 ? "var(--good)" : "var(--bad)"}">${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff), e.m.unit)}</div></div>
        <div><div class="label">Projected</div><div class="v">${fmt(e.projected, e.m.unit)}</div></div>
        <div><div class="label">Need / day</div><div class="v">${e.remaining ? fmt(e.perDayNeeded, e.m.unit) : "—"}</div></div>
      </div>
      <ul class="drivers">${kids.map(k => `<li><span>${esc(k.m.name)}</span><span class="num muted" style="font-size:12.5px">${fmt(k.actual, k.m.unit)} / ${fmt(k.m.target, k.m.unit)}</span>${pill("s-" + k.status, STATUS_TXT[k.status])}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const lagList = lagging.length ? `<ul class="lag">${lagging.map(e => {
    const parent = e.m.parent ? METRICS.find(p => p.id === e.m.parent).name : "Monthly target";
    const why = e.remaining > 0
      ? `Running ${fmt(e.perDayRun, e.m.unit)}/day. Needs ${fmt(e.perDayNeeded, e.m.unit)}/day for the last ${e.remaining} ${e.remaining === 1 ? "day" : "days"}.`
      : `Month closed at ${fmt(e.actual, e.m.unit)}.`;
    return `<li>${pill("s-" + e.status, STATUS_TXT[e.status])}<div style="min-width:0"><div class="what">${esc(e.m.name)} <span class="muted" style="font-weight:400;font-size:13px">· ${esc(parent)}</span></div><div class="why">${why}</div></div>
      <div class="gap" style="color:var(--bad)">${Math.round((e.ratio - 1) * 100)}%<div class="muted" style="font-weight:400;font-size:11.5px">projected vs. target</div></div></li>`; }).join("")}</ul>`
    : `<p class="empty">Every indicator is on pace.</p>`;

  const logInputs = parents.map(p => {
    const kids = METRICS.filter(k => k.parent === p.m.id && !k.sum);
    const fields = (p.m.sum ? [] : [p.m]).concat(kids);
    return `<div class="grp label">${esc(p.m.name)}</div>` + fields.map(f => `<label for="log-${f.id}">${esc(f.name)}${f.unit === "$" ? " ($)" : ""}
      <input class="f num" type="number" min="0" step="${f.unit === "$" ? 50 : 1}" id="log-${f.id}" data-log="${f.id}" value="${state.logs[f.id]?.[DAY] ?? ""}" placeholder="0"></label>`).join("");
  }).join("");

  $("#v-targets").innerHTML = `
    <div class="view-head"><div><h2>${MONTH_NAME} targets</h2><div class="muted" style="font-size:14px">Day ${el} of ${DIM} counted${todayLogged() ? ", including today" : ". Log today's numbers below to include today"}. The marker and dashed line show where you should be by now.</div></div></div>
    <div class="tgt-grid">${cards}</div>
    <div class="two-col">
      <div class="panel"><div class="panel-head"><h3>What's lagging</h3><span class="muted" style="font-size:13px">Worst first</span></div>${lagList}</div>
      <form class="panel" id="logform"><div class="panel-head"><h3>Log today · ${NOW.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</h3><button class="btn primary" type="submit">Save today</button></div>
        <div class="log-grid">${logInputs}</div></form>
    </div>`;
}

function renderNav(active) {
  const inboxOpen = state.inbox.filter(i => !i.done && !i.replied && i.cat === mode);
  const hi = inboxOpen.filter(i => i.pri === "high").length;
  const myTasks = state.tasks.filter(t => inMode(t) && mine(t));
  const over = myTasks.filter(t => t.due <= TODAY).length;
  const lag = METRICS.filter(m => !m.parent).map(evalMetric).filter(e => e.status !== "ok").length;
  const goalsOff = GOALS.map(goalEval).filter(e => e.status !== "ok").length;
  const counts = {
    inbox: [inboxOpen.length, hi > 0], tasks: [myTasks.length, over > 0], meetings: [MEETINGS.filter(m => m.date === TODAY).length, false],
    payments: (() => { const d = state.payments.filter(p => p.mode === mode && p.status === "due"); return [d.filter(p => p.due <= dayFromToday(7)).length, d.some(p => p.due < TODAY)]; })(),
    targets: [lag ? `${lag} off` : "OK", lag > 0], goals: [goalsOff ? `${goalsOff} off` : "OK", goalsOff > 0],
  };
  const GEAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`;
  $("#tabs").innerHTML = TABS[mode].map(([k, label]) => `<a href="#${k}" data-tab="${k}" ${k === active ? 'aria-current="page"' : ""}>${k === "settings" ? GEAR : ""}${label}${counts[k] ? ` <span class="count ${counts[k][1] ? "hot" : ""}">${counts[k][0]}</span>` : ""}</a>`).join("");
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  document.documentElement.setAttribute("data-mode", mode);
}

const renderers = { today: renderToday, inbox: renderInbox, meetings: renderMeetings, tasks: renderTasks, payments: renderPayments, departments: renderDepartments, settings: renderSettings, targets: renderTargets, health: renderHealth, goals: renderGoals };
const modeHas = (m, t) => TABS[m].some(([k]) => k === t);
const fromHash = () => { const h = location.hash.replace("#", ""); return renderers[h] ? h : null; };
let tab = fromHash() || "today";
if (!modeHas(mode, tab)) mode = mode === "business" ? "personal" : "business";
if (!modeHas(mode, tab)) tab = "today";
function current() { return tab; }
function go(t) { tab = t; try { history.replaceState(null, "", "#" + t); } catch (e) {} render(); window.scrollTo(0, 0); }
function render() {
  if (!modeHas(mode, tab)) tab = "today";
  for (const k of Object.keys(renderers)) $("#v-" + k).hidden = k !== tab;
  renderers[tab]();
  renderNav(tab);
  if (tab === "inbox" && ui.open) {
    const b = $("#bubbles-" + ui.open); if (b) b.scrollTop = b.scrollHeight;
    if (ui.focus === ui.open) {
      const ta = $("#reply-" + ui.open), row = $("#msg-" + ui.open);
      if (row) row.scrollIntoView({ block: "nearest" });
      if (ta) ta.focus({ preventScroll: true });
    }
    ui.focus = null;
  }
  if (tab === "meetings" && ui.scrollMeeting) { const el = $("#mt-" + ui.scrollMeeting); if (el) el.scrollIntoView({ block: "start" }); ui.scrollMeeting = null; }
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("button, a");
  if (!b) return;
  const href = b.getAttribute("href");
  if (href && href.startsWith("#") && renderers[href.slice(1)]) e.preventDefault();
  if (b.dataset.openmsg) { ui.open = ui.focus = b.dataset.openmsg; go("inbox"); }
  else if (b.dataset.openmeeting) { ui.openMeetings.add(b.dataset.openmeeting); ui.scrollMeeting = b.dataset.openmeeting; tab = "meetings"; try { history.replaceState(null, "", "#meetings"); } catch (err) {} render(); }
  else if (b.dataset.togglemeeting) { const id = b.dataset.togglemeeting; ui.openMeetings.has(id) ? ui.openMeetings.delete(id) : ui.openMeetings.add(id); render(); }
  else if (b.dataset.toggletranscript) { const id = b.dataset.toggletranscript; ui.transcripts.has(id) ? ui.transcripts.delete(id) : ui.transcripts.add(id); render(); }
  else if (b.dataset.scan) scan(b.dataset.scan);
  else if (b.dataset.togdept) { const [pid, d] = b.dataset.togdept.split(":"); const p = state.team.find(x => x.id === pid); p.depts = p.depts.includes(d) ? p.depts.filter(x => x !== d) : [...p.depts, d]; save(); render(); }
  else if (b.dataset.delhandle) { const [pid, k] = b.dataset.delhandle.split(":"); state.team.find(x => x.id === pid).handles.splice(+k, 1); save(); render(); }
  else if (b.dataset.delperson) { const p = state.team.find(x => x.id === b.dataset.delperson); state.team = state.team.filter(x => x !== p); save(); render(); toast(`Removed ${p.name}`); }
  else if (b.dataset.rulemove) { const [id, dir] = b.dataset.rulemove.split(":"); const k = state.rules.findIndex(r => r.id === id), j = k + +dir; if (j >= 0 && j < state.rules.length) { [state.rules[k], state.rules[j]] = [state.rules[j], state.rules[k]]; applyRules(); save(); render(); } }
  else if (b.dataset.delrule) { state.rules = state.rules.filter(r => r.id !== b.dataset.delrule); applyRules(); save(); render(); toast("Rule deleted"); }
  else if (b.id === "clear-manual") { state.inbox.forEach(i => delete i.manual); applyRules(); save(); render(); toast("Chats re-sorted by your rules"); }
  else if (b.dataset.dellink) { state.links[mode] = state.links[mode].filter(k => k.id !== b.dataset.dellink); save(); render(); }
  else if (b.dataset.opendept !== undefined) { ui.dept = b.dataset.opendept || null; ui.deptStatus = "all"; render(); window.scrollTo(0, 0); }
  else if (b.dataset.showpaid) { ui.showPaid = !ui.showPaid; render(); }
  else if (b.dataset.sec) { prefs.secOpen = prefs.secOpen || {}; prefs.secOpen[b.dataset.sec] = b.getAttribute("aria-expanded") !== "true"; savePrefs(); render(); }
  else if (b.dataset.later) { const k = b.dataset.later; ui.showLater.has(k) ? ui.showLater.delete(k) : ui.showLater.add(k); render(); }
  else if (b.dataset.delegate) { const id = b.dataset.delegate; if (ui.delegating === id) ui.delegating = null; else { ui.delegating = id; ui.dgAll = false; ui.dgTo = null; ui.dgNote = ""; } render(); const n = $("#dg-note"); if (n) n.focus(); }
  else if (b.dataset.dgall) { const r = document.querySelector('input[name="dg-to"]:checked'); ui.dgTo = r ? r.value : null; ui.dgAll = !ui.dgAll; render(); }
  else if (b.dataset.dgcancel) { ui.delegating = null; render(); }
  else if (b.dataset.undelegate) { const t = state.tasks.find(x => x.id === b.dataset.undelegate); delete t.delegatedTo; save(); render(); toast("Task is back on your plate"); }
  else if (b.dataset.scanstop) { if (scanning) scanning.ctl.abort(); }
  else if (b.dataset.sgadd) {
    const g = state.suggestions.find(x => x.id === b.dataset.sgadd);
    state.tasks.push({ id: "t" + Date.now(), title: g.title, type: g.type, dept: g.dept, project: g.project, pri: g.pri, due: g.due, done: false, src: g.src, delegable: g.delegable !== undefined ? g.delegable : g.type === "business" });
    g.status = "accepted"; save(); render(); toast("Task added");
  }
  else if (b.dataset.sgdismiss) { state.suggestions.find(x => x.id === b.dataset.sgdismiss).status = "dismissed"; save(); render(); toast("Suggestion dismissed"); }
  else if (href && href.startsWith("#") && renderers[href.slice(1)]) go(href.slice(1));
  else if (b.dataset.mode) { if (b.dataset.mode !== mode) { mode = prefs.mode = b.dataset.mode; savePrefs(); ui.delegating = null; if (!modeHas(mode, tab)) tab = "today"; try { history.replaceState(null, "", "#" + tab); } catch (err) {} render(); window.scrollTo(0, 0); } }
  else if (b.dataset.focusdel) { const [scope, id] = b.dataset.focusdel.split(":"); const items = focusItems(scope); items.splice(items.findIndex(f => f.id === id), 1); save(); render(); }
  else if (b.dataset.habit) { const h = b.dataset.habit; state.habits[h] = state.habits[h] || {}; if (state.habits[h][TODAY]) delete state.habits[h][TODAY]; else state.habits[h][TODAY] = true; save(); render(); }
  else if (b.dataset.goalsave) { const id = b.dataset.goalsave, v = parseFloat($("#goal-" + id).value); if (!isNaN(v) && v >= 0) { state.goals[id] = v; save(); render(); toast("Goal updated"); } }
  else if (b.dataset.reply) { const id = b.dataset.reply; ui.open = ui.open === id ? null : id; ui.focus = ui.open; render(); }
  else if (b.dataset.send) sendReply(b.dataset.send, !!b.dataset.close);
  else if (b.dataset.ui) { ui[b.dataset.ui] = b.dataset.val; render(); }
  else if (b.dataset.archive) { state.inbox.find(i => i.id === b.dataset.archive).done = true; save(); render(); toast("Marked done"); }
  else if (b.dataset.totask) {
    const i = state.inbox.find(x => x.id === b.dataset.totask);
    state.tasks.push({ id: "t" + Date.now(), title: `Reply to ${i.from}: ${i.text.slice(0, 70)}${i.text.length > 70 ? "…" : ""}`, type: i.cat, dept: i.cat === "personal" ? "Personal" : "Operations", project: i.project || "Internal Ops", pri: i.pri, due: TODAY, done: false });
    i.done = true; save(); render(); toast("Task added, due today");
  }
  else if (b.id === "restore-inbox") { state.inbox.forEach(i => { if (i.cat === mode) i.done = false; }); save(); render(); }
  else if (b.id === "sched-toggle") { prefs.schedOpen = b.getAttribute("aria-expanded") !== "true"; savePrefs(); render(); }
  else if (b.id === "reset") { state = fresh(); save(); render(); toast("Sample data reset"); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.uisel) { ui[t.dataset.uisel] = t.value; render(); }
  else if (t.dataset.focusdone) { const [scope, id] = t.dataset.focusdone.split(":"); const f = focusItems(scope).find(x => x.id === id); f.done = t.checked; save(); render(); }
  else if (t.dataset.habit) { const h = t.dataset.habit; state.habits[h] = state.habits[h] || {}; if (t.checked) state.habits[h][TODAY] = true; else delete state.habits[h][TODAY]; save(); render(); }
  else if (t.dataset.paid) {
    const p = state.payments.find(x => x.id === t.dataset.paid);
    if (t.checked) {
      p.status = "paid"; p.paidAt = Date.now();
      let msg = "Marked paid";
      if (p.repeat && p.repeat !== "none") {
        const next = { ...p, id: "p" + Date.now(), due: nextDue(p.due, p.repeat), status: "due", paidAt: null, rolledFrom: p.id };
        state.payments.push(next); p.nextId = next.id;
        msg += `. Next one added for ${new Date(next.due + "T00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}`;
      }
      save(); render(); toast(msg);
    } else {
      p.status = "due"; p.paidAt = null;
      // Undo the roll-forward if the next occurrence hasn't been touched.
      if (p.nextId) { const n = state.payments.find(x => x.id === p.nextId); if (n && n.status === "due") state.payments = state.payments.filter(x => x.id !== p.nextId); delete p.nextId; }
      save(); render(); toast("Moved back to due");
    }
  }
  else if (t.dataset.tpri) { state.tasks.find(x => x.id === t.dataset.tpri).pri = t.value; save(); render(); toast(`Moved to ${PRI[t.value]} priority`); }
  else if (t.dataset.sgpri) { state.suggestions.find(g => g.id === t.dataset.sgpri).pri = t.value; save(); }
  else if (t.dataset.sgdue) { if (t.value) { state.suggestions.find(g => g.id === t.dataset.sgdue).due = t.value; save(); } }
  else if (t.dataset.cat) { const i = state.inbox.find(x => x.id === t.dataset.cat); i.cat = t.value; i.line = t.value === "business" ? i.line || "agency" : null; i.manual = true; save(); render(); }
  else if (t.dataset.pri) { state.inbox.find(i => i.id === t.dataset.pri).pri = t.value; save(); render(); }
  else if (t.dataset.done) { const task = state.tasks.find(x => x.id === t.dataset.done); task.done = t.checked; task.doneAt = t.checked ? Date.now() : null; save(); render(); if (t.checked) toast("Task done"); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "addtask") {
    const title = $("#nt-title").value.trim(); if (!title) return;
    state.tasks.push({ id: "t" + Date.now(), title, type: $("#nt-type").value, dept: $("#nt-dept").value, project: $("#nt-proj").value, pri: $("#nt-pri").value, due: $("#nt-due").value || TODAY, done: false, delegable: $("#nt-type").value === "business" });
    save(); render(); toast("Task added");
  } else if (e.target.dataset.addhandle) {
    const pid = e.target.dataset.addhandle, inp = $("#h-in-" + pid), v = inp.value.trim();
    if (!v) return;
    const p = state.team.find(x => x.id === pid); if (!p.handles.some(h => norm(h) === norm(v))) p.handles.push(v);
    save(); render(); const again = $("#h-in-" + pid); if (again) again.focus();
  } else if (e.target.id === "addperson") {
    const name = $("#np-name").value.trim(); if (!name) return;
    state.team.push({ id: "u" + Date.now(), name, role: $("#np-role").value.trim() || "Team member", depts: [$("#np-dept").value], handles: $("#np-handles").value.split(",").map(x => x.trim()).filter(Boolean) });
    save(); render(); toast(`Added ${name}`);
  } else if (e.target.id === "addrule") {
    const op = $("#nr-op").value, value = $("#nr-value").value.trim();
    if (op !== "any" && !value) { toast("Add what the rule should match"); $("#nr-value").focus(); return; }
    const [cat, line] = $("#nr-assign").value.split(":");
    state.rules.push({ id: "r" + Date.now(), source: $("#nr-source").value, field: $("#nr-field").value, op, value: op === "any" ? "" : value, cat, line: line || null });
    applyRules(); save(); render(); toast("Rule added");
  } else if (e.target.id === "addlink") {
    const label = $("#nl-label").value.trim(), url = cleanUrl($("#nl-url").value);
    if (!label) { toast("Add the text to show"); $("#nl-label").focus(); return; }
    if (!url) { toast("That doesn't look like a web address"); $("#nl-url").focus(); return; }
    state.links[mode].push({ id: "l" + Date.now(), label, url });
    save(); render(); toast("Link added");
  } else if (e.target.id === "addpay") {
    const payee = $("#np-payee").value.trim(), amount = parseFloat($("#np-amount").value);
    if (!payee || !(amount > 0)) { toast("Add a payee and an amount"); return; }
    state.payments.push({ id: "p" + Date.now(), mode, payee, what: $("#np-what").value.trim(), amount: Math.round(amount * 100) / 100, due: $("#np-due").value || TODAY, category: $("#np-cat").value, method: "", repeat: $("#np-repeat").value, status: "due" });
    save(); render(); toast("Payment added");
  } else if (e.target.dataset.focusadd) {
    const scope = e.target.dataset.focusadd, inp = $("#focus-in-" + scope), text = inp.value.trim();
    if (!text) return;
    focusItems(scope).push({ id: "f" + Date.now(), text, done: false });
    save(); render(); const again = $("#focus-in-" + scope); if (again) again.focus();
  } else if (e.target.id === "dg-form") {
    const t = state.tasks.find(x => x.id === e.target.dataset.task);
    const r = document.querySelector('input[name="dg-to"]:checked'), note = $("#dg-note").value.trim();
    if (!r) { toast("Pick who should take it"); return; }
    if (!note) { toast("Add a note on what needs to be done"); $("#dg-note").focus(); return; }
    const person = state.team.find(p => p.name === r.value);
    const due = $("#dg-due").value || t.due;
    t.due = due;
    t.delegatedTo = { name: person.name, role: person.role, note, at: Date.now() };
    state.outbox.push({ id: "o" + Date.now(), source: "slack", to: person.name, ctx: "Direct message", text: `New task for you: ${t.title} (due ${due})

${note}`, at: Date.now(), status: "queued", taskId: t.id });
    ui.delegating = null; ui.dgNote = "";
    save(); render(); toast(`Delegated to ${person.name.split(" ")[0]}. Slack message queued.`);
  } else if (e.target.id === "logform") {
    document.querySelectorAll("[data-log]").forEach(inp => {
      const id = inp.dataset.log; state.logs[id] = state.logs[id] || {};
      if (inp.value === "") delete state.logs[id][DAY]; else state.logs[id][DAY] = Math.max(0, +inp.value);
    });
    save(); render(); toast("Today's numbers saved");
  }
});
document.addEventListener("input", e => { if (e.target.dataset.draft) ui.drafts[e.target.dataset.draft] = e.target.value; if (e.target.id === "dg-note") ui.dgNote = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.dataset.draft && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendReply(e.target.dataset.draft, false); }
});
window.addEventListener("hashchange", () => { const h = fromHash(); if (h && h !== tab) { tab = h; render(); } });

applyRules();
$("#today-date").textContent = NOW.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
render();
})();
</script>

</body></html>
